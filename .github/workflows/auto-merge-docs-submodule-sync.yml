name: auto-merge-docs-submodule-sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

# Stage 2: Tier 1 eligible docs gitlink-only pull requests are merged after all
# fail-closed checks pass. Every other pull request is escalated for review.
jobs:
  evaluate-and-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # PR labels/comments use Issues endpoints, but GitHub's API requires
      # pull_requests: write as well as issues: write for these PR mutations.
      pull-requests: write
      issues: write
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true

    steps:
      - name: Resolve pull request context
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        with:
          script: |
            const rawNumber = context.eventName === 'workflow_dispatch'
              ? process.env.PR_NUMBER_INPUT
              : context.payload.pull_request?.number;
            const prNumber = Number(rawNumber);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pr_number: ${rawNumber}`);
              return;
            }
            // Preserve the target for the failure-escalation step even if the
            // first pull-request API call fails.
            core.setOutput('number', String(prNumber));

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('head_sha', pull.head.sha);

      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate Tier 1 conditions and record result
        id: evaluate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const { execFileSync, spawnSync } = require('node:child_process');
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedRepository = 'hiroshino728/water-denki-emergency-mvp';
            const docsRepository = 'https://github.com/hiroshino728/mizu-denki-emergency-docs.git';
            const failures = [];
            const checks = [];
            const record = (name, passed, detail) => {
              checks.push({ name, passed, detail });
              if (!passed) failures.push(`${name}: ${detail}`);
            };

            let pull;
            try {
              // GitHub may initially return mergeable=null while calculating it.
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                ({ data: pull } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                }));
                if (pull.mergeable !== null) break;
                if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 3000));
              }
            } catch (error) {
              core.setFailed(`Unable to fetch PR #${prNumber}: ${error.message}`);
              return;
            }

            const body = pull.body || '';
            const decisionMatch = body.match(
              /^## Does this PR change a Decision\?[\t ]*\r?\n(?:[\t ]*\r?\n)?[\t ]*(Yes|No)[\t ]*(?:\r?\n|$)/im,
            );
            record(
              '3.1 Decision is No',
              Boolean(decisionMatch && decisionMatch[1].toLowerCase() === 'no'),
              decisionMatch ? `Decision: ${decisionMatch[1]}` : 'strict Decision section not found',
            );

            let files = [];
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              record(
                '3.2 API diff is docs gitlink only',
                files.length === 1 && files[0].filename === 'docs',
                `files=[${files.map(file => file.filename).join(', ')}]`,
              );
            } catch (error) {
              record('3.2 API diff is docs gitlink only', false, `API error: ${error.message}`);
            }

            record('3.3 PR is not draft', pull.draft === false, `draft=${pull.draft}`);
            record(
              '3.4 PR is mergeable',
              pull.mergeable === true && ['clean', 'unstable'].includes(pull.mergeable_state),
              `mergeable=${pull.mergeable}, state=${pull.mergeable_state}`,
            );

            try {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pull.head.sha,
                per_page: 100,
              });
              // A workflow sees its own in-progress check run. Exclude only this
              // exact run; every other check must have concluded successfully.
              const otherRuns = checkRuns.filter(run =>
                !String(run.details_url || '').includes(`/actions/runs/${context.runId}`),
              );
              const badRuns = otherRuns.filter(run =>
                run.status !== 'completed' || run.conclusion !== 'success',
              );
              const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pull.head.sha,
              });
              const statusesPass = combinedStatus.total_count === 0 || combinedStatus.state === 'success';
              record(
                '3.5 CI is absent or successful',
                badRuns.length === 0 && statusesPass,
                `other_check_runs=${otherRuns.length}, bad=${badRuns.map(run => run.name).join(',') || 'none'}, commit_status=${combinedStatus.state}, statuses=${combinedStatus.total_count}`,
              );
            } catch (error) {
              record('3.5 CI is absent or successful', false, `API error: ${error.message}`);
            }

            const changedPaths = files.map(file => file.filename);
            const bubblePaths = changedPaths.filter(path => path.toLowerCase().includes('bubble'));
            record(
              '3.6 no Bubble Production paths',
              bubblePaths.length === 0,
              `matches=[${bubblePaths.join(', ')}]`,
            );
            const workflowPaths = changedPaths.filter(path => path.startsWith('.github/workflows/'));
            record(
              '3.7 no workflow changes',
              workflowPaths.length === 0,
              `matches=[${workflowPaths.join(', ')}]`,
            );
            record(
              '3.7 repository is expected',
              context.repo.owner + '/' + context.repo.repo === expectedRepository,
              `repository=${context.repo.owner}/${context.repo.repo}`,
            );
            record('3.7 base is main', pull.base.ref === 'main', `base=${pull.base.ref}`);
            record(
              '3.7 head repository is same repository',
              pull.head.repo?.full_name === expectedRepository,
              `head_repository=${pull.head.repo?.full_name || 'unknown'}`,
            );
            record(
              '3.7 evaluated SHA matches checked-out SHA',
              pull.head.sha === process.env.EXPECTED_HEAD_SHA,
              `api=${pull.head.sha}, resolved=${process.env.EXPECTED_HEAD_SHA}`,
            );

            try {
              execFileSync('git', ['fetch', '--no-tags', 'origin', 'main'], { stdio: 'pipe' });
              const names = execFileSync(
                'git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' },
              ).trim().split('\n').filter(Boolean);
              record(
                '3.2 local diff is docs only',
                names.length === 1 && names[0] === 'docs',
                `files=[${names.join(', ')}]`,
              );

              const raw = execFileSync(
                'git', ['diff', '--raw', 'origin/main...HEAD', '--', 'docs'], { encoding: 'utf8' },
              ).trim();
              const gitlinkMode = /^:160000 160000 [0-9a-f]+ [0-9a-f]+ M\tdocs$/m.test(raw);
              const submoduleDiff = execFileSync(
                'git', ['diff', '--submodule=short', 'origin/main...HEAD', '--', 'docs'], { encoding: 'utf8' },
              );
              const commitLines = submoduleDiff.match(/^[+-]Subproject commit [0-9a-f]+$/gm) || [];
              record(
                '3.2 docs change is a gitlink update',
                gitlinkMode && commitLines.length === 2,
                `gitlink_mode=${gitlinkMode}, subproject_lines=${commitLines.length}`,
              );
              const gitlinkSha = treeish => {
                const entry = execFileSync(
                  'git', ['ls-tree', treeish, '--', 'docs'], { encoding: 'utf8' },
                ).trim();
                const match = entry.match(/^160000 commit ([0-9a-f]{40})\tdocs$/);
                if (!match) throw new Error(`Unable to resolve docs gitlink at ${treeish}`);
                return match[1];
              };
              const baseDocsSha = gitlinkSha('origin/main');
              const targetDocsSha = gitlinkSha('HEAD');
              execFileSync('git', ['fetch', '--no-tags', docsRepository, 'main'], { stdio: 'pipe' });
              const docsMainSha = execFileSync(
                'git', ['rev-parse', 'FETCH_HEAD'], { encoding: 'utf8' },
              ).trim();
              const baseIsReachable = spawnSync(
                'git', ['merge-base', '--is-ancestor', baseDocsSha, docsMainSha],
              ).status === 0;
              const targetIsReachable = spawnSync(
                'git', ['merge-base', '--is-ancestor', targetDocsSha, docsMainSha],
              ).status === 0;
              const isForwardUpdate = baseDocsSha !== targetDocsSha && spawnSync(
                'git', ['merge-base', '--is-ancestor', baseDocsSha, targetDocsSha],
              ).status === 0;
              record(
                '3.2 docs target is a forward update reachable from docs main',
                baseIsReachable && targetIsReachable && isForwardUpdate,
                `base=${baseDocsSha}, target=${targetDocsSha}, docs_main=${docsMainSha}, ` +
                  `base_reachable=${baseIsReachable}, target_reachable=${targetIsReachable}, ` +
                  `forward=${isForwardUpdate}`,
              );
              const workflowMatchesMain = spawnSync(
                'git',
                ['diff', '--quiet', 'origin/main', '--', '.github/workflows/auto-merge-docs-submodule-sync.yml'],
              ).status === 0;
              record(
                '3.8 workflow definition is active on main',
                workflowMatchesMain,
                `matches_origin_main=${workflowMatchesMain}`,
              );
            } catch (error) {
              record('3.2 local git verification', false, error.message);
            }

            const eligible = failures.length === 0;
            core.setOutput('eligible', String(eligible));
            const marker = '<!-- docs-submodule-auto-merge-evaluation -->';
            const table = checks.map(check =>
              `| ${check.passed ? 'PASS' : 'FAIL'} | ${check.name} | ${String(check.detail).replaceAll('|', '\\|')} |`,
            ).join('\n');
            const resultBody = `${marker}\n## Docs submodule auto-merge evaluation\n\n` +
              `Result: **${eligible ? 'would merge' : 'needs human review'}**\n\n` +
              `${eligible ? 'Stage 2 will now attempt the automatic merge.' : 'No merge API will be called.'}\n\n` +
              `| Result | Check | Detail |\n|---|---|---|\n${table}`;

            if (!eligible) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-human-review',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-human-review',
                  color: 'B60205',
                  description: '自動判定条件を満たさず、人間による確認が必要',
                }).catch(createError => {
                  // Another PR may create this repository-wide label between
                  // getLabel and createLabel. Treat only "already exists" as safe.
                  if (createError.status !== 422) throw createError;
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['needs-human-review'],
              });
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: resultBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: resultBody,
              });
            }

            await core.summary
              .addHeading('Docs submodule auto-merge evaluation')
              .addRaw(resultBody.replace(marker, ''))
              .write();
            core.info(eligible ? 'would merge' : `needs human review: ${failures.join('; ')}`);

      - name: Merge eligible Tier 1 pull request
        if: steps.evaluate.outputs.eligible == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedSha = process.env.EXPECTED_HEAD_SHA;
            const expectedRepository = 'hiroshino728/water-denki-emergency-mvp';
            const docsRepository = 'https://github.com/hiroshino728/mizu-denki-emergency-docs.git';
            let pull;
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              ({ data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }));
              if (pull.mergeable !== null) break;
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 3000));
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const decisionMatch = (pull.body || '').match(
              /^## Does this PR change a Decision\?[\t ]*\r?\n(?:[\t ]*\r?\n)?[\t ]*(Yes|No)[\t ]*(?:\r?\n|$)/im,
            );
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pull.head.sha,
              per_page: 100,
            });
            const otherRuns = checkRuns.filter(run =>
              !String(run.details_url || '').includes(`/actions/runs/${context.runId}`),
            );
            const badRuns = otherRuns.filter(run =>
              run.status !== 'completed' || run.conclusion !== 'success',
            );
            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pull.head.sha,
            });
            const statusesPass = combinedStatus.total_count === 0 || combinedStatus.state === 'success';
            const fetchMain = spawnSync('git', ['fetch', '--no-tags', 'origin', 'main']);
            if (fetchMain.status !== 0) {
              core.setFailed('Unable to refresh origin/main immediately before merge.');
              return;
            }
            const gitlinkSha = treeish => {
              const entry = spawnSync(
                'git', ['ls-tree', treeish, '--', 'docs'], { encoding: 'utf8' },
              );
              const match = entry.stdout?.trim().match(/^160000 commit ([0-9a-f]{40})\tdocs$/);
              return entry.status === 0 ? match?.[1] : undefined;
            };
            const baseDocsSha = gitlinkSha('origin/main');
            const targetDocsSha = gitlinkSha('HEAD');
            const fetchDocsMain = spawnSync(
              'git', ['fetch', '--no-tags', docsRepository, 'main'],
            );
            const docsMain = spawnSync('git', ['rev-parse', 'FETCH_HEAD'], { encoding: 'utf8' });
            const docsMainSha = docsMain.status === 0 ? docsMain.stdout.trim() : undefined;
            const baseIsReachable = Boolean(baseDocsSha && docsMainSha) && spawnSync(
              'git', ['merge-base', '--is-ancestor', baseDocsSha, docsMainSha],
            ).status === 0;
            const targetIsReachable = Boolean(targetDocsSha && docsMainSha) && spawnSync(
              'git', ['merge-base', '--is-ancestor', targetDocsSha, docsMainSha],
            ).status === 0;
            const isForwardUpdate = Boolean(baseDocsSha && targetDocsSha) &&
              baseDocsSha !== targetDocsSha && spawnSync(
                'git', ['merge-base', '--is-ancestor', baseDocsSha, targetDocsSha],
              ).status === 0;
            const workflowMatchesMain = spawnSync(
              'git',
              ['diff', '--quiet', 'origin/main', '--', '.github/workflows/auto-merge-docs-submodule-sync.yml'],
            ).status === 0;

            const stillEligible =
              pull.state === 'open' &&
              pull.draft === false &&
              pull.mergeable === true &&
              ['clean', 'unstable'].includes(pull.mergeable_state) &&
              pull.base.ref === 'main' &&
              pull.head.repo?.full_name === expectedRepository &&
              pull.head.sha === expectedSha &&
              Boolean(decisionMatch && decisionMatch[1].toLowerCase() === 'no') &&
              files.length === 1 &&
              files[0].filename === 'docs' &&
              badRuns.length === 0 &&
              statusesPass &&
              fetchDocsMain.status === 0 &&
              baseIsReachable &&
              targetIsReachable &&
              isForwardUpdate &&
              workflowMatchesMain;
            if (!stillEligible) {
              core.setFailed(
                `PR changed after evaluation: state=${pull.state}, draft=${pull.draft}, ` +
                `base=${pull.base.ref}, head_repository=${pull.head.repo?.full_name || 'unknown'}, ` +
                `head_sha=${pull.head.sha}, expected_sha=${expectedSha}, ` +
                `decision=${decisionMatch?.[1] || 'missing'}, ` +
                `files=[${files.map(file => file.filename).join(', ')}], ` +
                `mergeable=${pull.mergeable}, mergeable_state=${pull.mergeable_state}, ` +
                `bad_checks=[${badRuns.map(run => run.name).join(', ')}], ` +
                `commit_status=${combinedStatus.state}, base_docs=${baseDocsSha || 'unknown'}, ` +
                `target_docs=${targetDocsSha || 'unknown'}, docs_main=${docsMainSha || 'unknown'}, ` +
                `base_reachable=${baseIsReachable}, target_reachable=${targetIsReachable}, ` +
                `forward=${isForwardUpdate}, workflow_matches_main=${workflowMatchesMain}`,
              );
              return;
            }

            const { data: result } = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              sha: expectedSha,
              merge_method: 'merge',
            });
            if (!result.merged) {
              core.setFailed(`Automatic merge was rejected: ${result.message || 'unknown reason'}`);
              return;
            }
            core.info(`Merged PR #${prNumber} at ${result.sha}`);

      - name: Escalate unexpected evaluator or merge failure
        if: failure() && steps.pr.outputs.number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- docs-submodule-auto-merge-error -->';
            const body = `${marker}\n## Docs submodule auto-merge escalation\n\n` +
              `The evaluator or merge step stopped unexpectedly. Automatic merge did not ` +
              `complete successfully. Review the failed Actions run before proceeding.`;

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'needs-human-review',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'needs-human-review',
                color: 'B60205',
                description: '自動判定条件を満たさず、人間による確認が必要',
              }).catch(createError => {
                if (createError.status !== 422) throw createError;
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['needs-human-review'],
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
